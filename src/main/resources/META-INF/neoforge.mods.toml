modLoader="javafml"
loaderVersion="[4,)"
license="All-Rights-Reserved"
issueTrackerURL="https://github.com/MCRcortex/voxy/issues"

[[mods]]
modId="voxy"
version="${version}"
displayName="Voxy"
description="Far distance rendering mod utilising LoDs"
authors="Cortex"
# Embeddium reads mod logos via PackResources.getRootResource(logoFile) and passes logoFile as a *single* segment.
# Therefore this must be a root-level file name without slashes.
logoFile="voxy_logo.png"

[[dependencies.voxy]]
modId="neoforge"
type="required"
versionRange="[21.1.115,)"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.voxy]]
modId="embeddium"
type="optional"
versionRange="[1.0.0,)"
ordering="AFTER"
side="CLIENT"

[[mixins]]
config="client.voxy.mixins.json"

[[mixins]]
config="common.voxy.mixins.json"
